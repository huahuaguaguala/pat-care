# 无 Redis 开发配置
# 使用方式: mvn spring-boot:run -Dspring-boot.run.profiles=noredis
# 或者设置环境变量: export SPRING_PROFILES_ACTIVE=noredis
#
# 此模式下 Redis 相关功能不可用（排行榜/签到/秒杀），但 CRUD 和认证正常

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# 标记 Redis 不可用
petcare:
  redis:
    enabled: false
